{% extends 'base.html' %}{% block title %}Verify 2FA{% endblock %}{% block content %}<div class="card auth-card mx-auto"><div class="card-body p-4 p-md-5"><h1 class="h4">Two-factor authentication</h1><p class="text-muted">Open your authenticator app and enter the current six-digit code.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label" for="code">Verification code</label><input class="form-control mb-4" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus><button class="btn btn-primary w-100">Verify and sign in</button></form></div></div>{% endblock %}
