{% extends 'base.html' %}{% block title %}Login{% endblock %}{% block content %}<div class="card auth-card mx-auto"><div class="card-body p-4 p-md-5"><span class="badge bg-soft mb-3">Secure access</span><h1 class="h3 mb-2">Welcome back</h1><p class="text-muted mb-4">Sign in with your username and password.</p><form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" autocomplete="username" required autofocus><label class="form-label" for="password">Password</label><input class="form-control mb-4" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary w-100">Continue securely</button></form><p class="text-muted small mt-3 mb-0">A six-digit authenticator code is required after password verification.</p></div></div>{% endblock %}
