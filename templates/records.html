{% extends 'base.html' %}{% block title %}My records{% endblock %}{% block content %}<a href="{{ url_for('dashboard') }}" class="small">← Dashboard</a><h1 class="h3 mt-3">My records</h1><div class="card mb-4"><div class="card-body"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="content" class="form-label">New record</label><textarea id="content" name="content" class="form-control mb-3" maxlength="500" required></textarea><button class="btn btn-primary">Save record</button></form></div></div><div class="card"><div class="card-body"><h2 class="h5">Saved records</h2>{% for row in rows %}<div class="border-bottom py-3"><div>{{ row['content'] }}</div><div class="small text-muted">{{ row['created_at'] }}</div></div>{% else %}<p class="text-muted">No records yet.</p>{% endfor %}</div></div>{% endblock %}
