{% extends 'base.html' %}{% block title %}Add user{% endblock %}{% block content %}<a href="{{ url_for('users') }}" class="small">← Users</a><div class="card auth-card mt-3"><div class="card-body p-4"><h1 class="h4">Create user account</h1><p class="text-muted small">New users must enroll an authenticator on their first login.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" minlength="3" maxlength="30" required><label class="form-label" for="password">Initial password (12+ characters)</label><input class="form-control mb-3" id="password" name="password" type="password" minlength="12" autocomplete="new-password" required>{% if current_user['role']=='administrator' %}<label class="form-label" for="role">Role</label><select class="form-select mb-3" name="role" id="role">{% for role in roles %}<option value="{{ role }}">{{ role|title }}</option>{% endfor %}</select>{% else %}<p class="small">New account role: <strong>Inputer</strong></p>{% endif %}<button class="btn btn-primary">Create account</button></form></div></div>{% endblock %}
