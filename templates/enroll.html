{% extends 'base.html' %}{% block title %}Set up 2FA{% endblock %}{% block content %}<div class="card auth-card mx-auto"><div class="card-body p-4"><h1 class="h4">Set up Google Authenticator</h1><p class="text-muted">Scan the QR code with an authenticator app. If scanning is unavailable, enter the setup key manually. Keep it private.</p><img class="qr" src="{{ url_for('enroll_qr') }}" alt="Private 2FA enrollment QR code"><p class="small text-break"><strong>Setup key:</strong> <code>{{ secret }}</code></p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="code" class="form-label">Enter the six-digit code to confirm setup</label><input class="form-control mb-3" name="code" id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><button class="btn btn-primary">Activate 2FA</button></form></div></div>{% endblock %}
