{% extends 'base.html' %}{% block title %}Delete user{% endblock %}{% block content %}<a href="{{ url_for('users') }}" class="small">← Users</a><div class="card auth-card mt-3"><div class="card-body p-4"><h1 class="h4">Delete user</h1><p class="text-muted">Deletion also removes the user's sample records. This action cannot be undone.</p><form method="post" onsubmit="return confirm('Delete this account permanently?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label" for="user_id">Select account</label><select class="form-select mb-3" id="user_id" name="user_id" required>{% for row in rows %}<option value="{{ row['id'] }}">{{ row['username'] }} ({{ row['role'] }})</option>{% endfor %}</select><button class="btn btn-danger" {% if not rows %}disabled{% endif %}>Delete selected account</button></form></div></div>{% endblock %}
